publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  http_parser: ^4.1.2
  file_picker: ^8.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  provider: ^6.1.2
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
